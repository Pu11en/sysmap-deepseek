<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>deepseek</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,sans-serif;color:#172033;background:white}body{display:flex;flex-direction:column}header{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:8px 12px;border-bottom:1px solid #ddd;font-size:13px}#title{flex:1}button{padding:5px 10px;border:1px solid #bbb;border-radius:6px;background:white;cursor:pointer}#viewport{position:relative;flex:1;min-height:0;overflow:hidden}#canvas{position:absolute;transform-origin:0 0}#canvas svg{display:block;max-width:none!important}#viewport.ready,#viewport.ready *{cursor:grab!important}#viewport.dragging,#viewport.dragging *{cursor:grabbing!important}#note{padding:16px}#hint{font-size:12px;color:#667085}#canvas .linked{cursor:pointer}
</style></head><body><header><strong>deepseek</strong><span id="title"></span><span id="hint">Ctrl-scroll: zoom · Space + drag: move</span><button id="back" hidden>Back</button><button id="less" aria-label="Zoom out">−</button><span id="scale"></span><button id="more" aria-label="Zoom in">+</button><button id="fit">Fit</button></header><main id="viewport" tabindex="0" aria-label="System map"><div id="canvas"></div><div id="note" role="status">Loading map…</div></main>
<script type="module">
const params=new URLSearchParams(location.search), name=params.get('map')||'library';
const viewport=document.getElementById('viewport'), canvas=document.getElementById('canvas'), note=document.getElementById('note');
let manifest,mermaid,page='main',trail=[],width=1,height=1,scale=1,x=0,y=0,manual=false,space=false,drag=null,suppress=false,sequence=0;
function paint(){canvas.style.transform=`translate(${x}px,${y}px) scale(${scale})`;document.getElementById('scale').textContent=Math.round(scale*100)+'%'}
function fit(){manual=false;scale=Math.min((viewport.clientWidth-24)/width,(viewport.clientHeight-24)/height,3);scale=Math.max(.001,scale);x=(viewport.clientWidth-width*scale)/2;y=(viewport.clientHeight-height*scale)/2;paint()}
function zoom(next,px=viewport.clientWidth/2,py=viewport.clientHeight/2){next=Math.min(8,Math.max(.01,next));x=px-(px-x)*next/scale;y=py-(py-y)*next/scale;scale=next;manual=true;paint()}
function saveUrl(){const q=new URLSearchParams({map:name,page,trail:JSON.stringify(trail)});history.pushState(null,'','?'+q)}
function navigate(target){if(!Object.hasOwn(manifest.pages,target))return;trail.push(page);page=target;saveUrl();show()}
async function show(){const serial=++sequence;note.textContent='Loading map…';try{if(!Object.hasOwn(manifest.pages,page))throw Error('Unknown page');const entry=manifest.pages[page];const response=await fetch('/maps/'+encodeURIComponent(entry.file),{cache:'no-store'});if(!response.ok)throw Error('Map drawing unavailable');const {svg}=await mermaid.render('deepseek_'+serial,await response.text());if(serial!==sequence)return;canvas.innerHTML=svg;const drawing=canvas.querySelector('svg');const vb=drawing.viewBox.baseVal;width=vb.width;height=vb.height;drawing.style.width=width+'px';drawing.style.height=height+'px';document.getElementById('title').textContent=entry.label;document.getElementById('back').hidden=!trail.length;note.textContent='';for(const node of canvas.querySelectorAll('g.node')){const id=/(?:^|-)flowchart-(.+)-\d+$/.exec(node.id)?.[1];if(id&&Object.hasOwn(entry.details,id)){node.classList.add('linked');node.addEventListener('click',()=>navigate(entry.details[id]))}}fit()}catch(error){note.textContent=error.message}}
document.getElementById('back').onclick=()=>{if(trail.length){page=trail.pop();saveUrl();show()}};
document.getElementById('fit').onclick=fit;document.getElementById('more').onclick=()=>zoom(scale*1.2);document.getElementById('less').onclick=()=>zoom(scale/1.2);
viewport.addEventListener('wheel',e=>{e.preventDefault();if(e.ctrlKey){const r=viewport.getBoundingClientRect();zoom(scale*Math.exp(-e.deltaY*.002),e.clientX-r.left,e.clientY-r.top)}else{x-=e.deltaX;y-=e.deltaY;manual=true;paint()}},{passive:false});
function typing(target){return target.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(target.tagName)}
window.addEventListener('keydown',e=>{if(e.code!=='Space'||typing(e.target))return;e.preventDefault();e.stopImmediatePropagation();space=true;viewport.classList.add('ready')},true);
function endDrag(){drag=null;viewport.classList.remove('dragging');document.body.style.userSelect=''}
window.addEventListener('keyup',e=>{if(e.code!=='Space'||(!space&&typing(e.target)))return;e.preventDefault();e.stopImmediatePropagation();space=false;viewport.classList.remove('ready');endDrag()},true);
viewport.addEventListener('mousedown',e=>{suppress=false;if(e.button!==0||!space)return;e.preventDefault();suppress=true;drag={mx:e.clientX,my:e.clientY,x,y};viewport.classList.add('dragging');document.body.style.userSelect='none'},true);
window.addEventListener('mousemove',e=>{if(!drag)return;if(!(e.buttons&1)){endDrag();return}x=drag.x+e.clientX-drag.mx;y=drag.y+e.clientY-drag.my;manual=true;paint()});
window.addEventListener('mouseup',endDrag);window.addEventListener('blur',()=>{space=false;viewport.classList.remove('ready');endDrag()});
viewport.addEventListener('click',e=>{if(space||suppress){e.preventDefault();e.stopImmediatePropagation();suppress=false}},true);
new ResizeObserver(()=>{if(!manual)fit()}).observe(viewport);
window.addEventListener('popstate',()=>{readUrl();show()});
function readUrl(){const q=new URLSearchParams(location.search);page=q.get('page')||'main';try{const parsed=JSON.parse(q.get('trail')||'[]');trail=Array.isArray(parsed)?parsed.filter(id=>Object.hasOwn(manifest.pages,id)):[]}catch{trail=[]}}
try{const response=await fetch('/maps/'+encodeURIComponent(name)+'.json',{cache:'no-store'});if(!response.ok)throw Error('Build the plan first, then open its map name.');manifest=await response.json();({default:mermaid}=await import('https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs'));mermaid.initialize({startOnLoad:false,securityLevel:'strict',flowchart:{htmlLabels:false}});readUrl();await show()}catch(error){note.textContent=error.message+' The viewer needs network access to load Mermaid.'}
</script></body></html>
